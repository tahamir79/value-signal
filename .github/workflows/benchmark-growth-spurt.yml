name: Benchmark ValueSignal Growth Spurt

on:
  workflow_dispatch:
  schedule:
    - cron: "35 10 * * 6"

permissions:
  contents: write

concurrency:
  group: value-signal-etl
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VS_USER_AGENT: "ValueSignal research ETL ${{ secrets.VS_CONTACT_EMAIL }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate contact configuration
        run: test -n "${{ secrets.VS_CONTACT_EMAIL }}"
      - name: Benchmark growth spurt detector
        run: python scripts/benchmark_growth_spurt.py
      - name: Commit benchmark report
        run: |
          git config user.name "value-signal-bot"
          git config user.email "value-signal-bot@users.noreply.github.com"
          git add -f data/reports/growth_spurt_benchmark.json
          git diff --cached --quiet || git commit -m "data: refresh Growth Spurt benchmark"
          git pull --rebase
          git push
