name: Audit ValueSignal forecast models

on:
  workflow_dispatch:
  schedule:
    - cron: "45 11 * * 6"

permissions:
  contents: write

concurrency:
  group: value-signal-etl
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Audit forecast training data
        run: python scripts/forecast/audit_training_dataset.py
      - name: Evaluate forecast model challengers
        run: python scripts/forecast/evaluate_models.py
      - name: Audit forecast artifacts
        run: python scripts/forecast/audit_forecasts.py
      - name: Commit forecast model reports
        run: |
          git config user.name "value-signal-bot"
          git config user.email "value-signal-bot@users.noreply.github.com"
          git add -f data/reports/forecast_model_leaderboard.json data/reports/forecast_backtest_30_day.json data/reports/forecast_backtest_90_day.json data/reports/forecast_data_quality.json data/reports/forecast_leakage_audit.json
          git diff --cached --quiet || git commit -m "data: refresh forecast model audit"
          git pull --rebase
          git push
