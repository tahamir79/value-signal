name: Refresh ValueSignal data
on:
  workflow_dispatch:
  schedule:
    - cron: "25 23 * * 1-5"
permissions:
  contents: write
concurrency:
  group: value-signal-etl
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VS_USER_AGENT: "ValueSignal research ETL ${{ secrets.VS_CONTACT_EMAIL }}"
      BALANCE_SHEET_SCORING_MODE: official
      VS_UNIVERSE_MODE: sec_listed_core
      VS_UNIVERSE_PATH: data/universe/universe.json
      VS_UNIVERSE_LIMIT: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate contact configuration
        run: test -n "${{ secrets.VS_CONTACT_EMAIL }}"
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Run brief generator tests
        run: npm ci && npm run test:brief
      - name: Build scaled universe
        run: python scripts/universe/build_universe.py --mode "$VS_UNIVERSE_MODE" --limit "$VS_UNIVERSE_LIMIT" --output-dir data/universe
      - name: Refresh live artifacts
        run: python scripts/run_etl.py --universe "$VS_UNIVERSE_PATH" --limit "$VS_UNIVERSE_LIMIT" --skip-backtest
      - name: Refresh SEC filing search index
        run: python scripts/build_search_index.py --universe "$VS_UNIVERSE_PATH" --limit "$VS_UNIVERSE_LIMIT"
      - name: Audit feature outputs
        run: python scripts/audit_features.py
      - name: Audit scoring outputs
        run: python scripts/audit_scoring.py
      - name: Audit backtest outputs
        run: python scripts/audit_backtest.py
      - name: Audit filing search outputs
        run: python scripts/audit_search.py
      - name: Commit changed artifacts
        run: |
          git config user.name "value-signal-bot"
          git config user.email "value-signal-bot@users.noreply.github.com"
          git add public/data/dashboard.json public/data/features.json public/data/signals.json public/data/backtest_results.json public/data/search_index.json public/data/search public/data/stocks public/data/etl_report.json public/data/universe_coverage_report.json
          git diff --cached --quiet || git commit -m "data: refresh ValueSignal artifacts"
          git push
