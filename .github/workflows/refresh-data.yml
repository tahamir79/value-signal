name: Refresh ValueSignal data
on:
  workflow_dispatch:
    inputs:
      etl_batch_size:
        description: "Number of companies to refresh and merge into the published universe"
        required: false
        default: "250"
      etl_batch_count:
        description: "Number of consecutive ETL batches to refresh"
        required: false
        default: "7"
  schedule:
    - cron: "25 23 * * 1-5"
    - cron: "25 2 * * 2-6"
    - cron: "25 5 * * 2-6"
    - cron: "25 8 * * 2-6"
permissions:
  contents: write
concurrency:
  group: value-signal-etl
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VS_USER_AGENT: "ValueSignal research ETL ${{ secrets.VS_CONTACT_EMAIL }}"
      BALANCE_SHEET_SCORING_MODE: official
      GROWTH_SPURT_MODE: display
      VS_UNIVERSE_MODE: sec_listed_core
      VS_UNIVERSE_PATH: data/universe/universe.json
      VS_UNIVERSE_LIMIT: "all"
      VS_ETL_BATCH_SIZE: ${{ github.event.inputs.etl_batch_size || '250' }}
      VS_ETL_BATCH_COUNT: ${{ github.event.inputs.etl_batch_count || '7' }}
      VS_DAILY_SWEEP_SLOTS: "4"
      VS_SEARCH_BATCH_SIZE: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate contact configuration
        run: test -n "${{ secrets.VS_CONTACT_EMAIL }}"
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Run brief generator tests
        run: npm ci && npm run test:brief
      - name: Build scaled universe
        run: python scripts/universe/build_universe.py --mode "$VS_UNIVERSE_MODE" --limit "$VS_UNIVERSE_LIMIT" --include-starter --output-dir data/universe
      - name: Refresh and merge live ETL rotation batches
        run: python scripts/pipeline/refresh_public_batch.py --universe "$VS_UNIVERSE_PATH" --batch-size "$VS_ETL_BATCH_SIZE" --batch-count "$VS_ETL_BATCH_COUNT" --skip-backtest
      - name: Benchmark growth spurt detector
        run: python scripts/benchmark_growth_spurt.py
      - name: Refresh SEC filing search index
        run: python scripts/build_search_index_batch.py --universe "$VS_UNIVERSE_PATH" --batch-size "$VS_SEARCH_BATCH_SIZE"
      - name: Refresh experimental forecast artifacts
        run: python scripts/forecast/run_forecast_pipeline.py --summary --scaled-fast
      - name: Audit feature outputs
        run: python scripts/audit_features.py
      - name: Audit scoring outputs
        run: python scripts/audit_scoring.py
      - name: Audit backtest outputs
        run: python scripts/audit_backtest.py
      - name: Audit filing search outputs
        run: python scripts/audit_search.py
      - name: Audit forecast outputs
        run: python scripts/forecast/audit_forecasts.py
      - name: Publish pipeline health report
        run: python scripts/pipeline_health.py
      - name: Commit changed artifacts
        run: |
          git config user.name "value-signal-bot"
          git config user.email "value-signal-bot@users.noreply.github.com"
          git add -f data/reports/scheduled_etl_batch_state.json
          git add public/data/dashboard.json public/data/features.json public/data/signals.json public/data/backtest_results.json public/data/search_index.json public/data/search public/data/stocks public/data/forecasts public/data/etl_report.json public/data/universe_coverage_report.json public/data/pipeline_health.json models/forecast
          git add -f data/reports/forecast_model_leaderboard.json data/reports/forecast_backtest_30_day.json data/reports/forecast_backtest_90_day.json data/reports/forecast_data_quality.json data/reports/forecast_leakage_audit.json data/reports/pipeline_health_report.json data/reports/growth_spurt_benchmark.json
          git diff --cached --quiet || git commit -m "data: refresh ValueSignal artifacts"
          git pull --rebase
          git push
